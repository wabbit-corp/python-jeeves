        - "follow for more"

        # Medium-specific / platform cues
        - "medium.com/@"
        - "medium.com/p/"
        - "substack.com"
        - "hashnode"
        - "dev.to"
        - "ghost blog"
        - "wordpress"
        - "blogspot"
        - "link in bio"
        - "read it here:"
        - "full post here"
        - "friends link"          # Medium “Friend Link” phrasing
        - "clap for this"
        - "give it a clap"
        - "claps appreciated"
        - "highlight this"
        - "responses welcome"

        # Monetization / funnel language
        - "support my writing"
        - "support me"
        - "buy me a coffee"
        - "kofi"
        - "ko-fi"
        - "patreon"
        - "donate"
        - "tip jar"
        - "affiliate link"
        - "affiliate links"
        - "sponsored post"
        - "sponsor"
        - "adsense"
        - "ad revenue"
        - "monetize"
        - "medium partner program"
        - "partner program"
        - "paid subscribers"
        - "premium newsletter"
        - "membership"
        - "join as a paid member"

      examples:
        positives:
          - "I just published a Medium post on LLM evals. Give it a read and clap if you like it."
          - "Check out my blog post about Kubernetes. Full post here: medium.com/@me/..."
          - "New article up on my personal blog. Subscribe for weekly posts."
          - "Support my writing on Medium Partner Program by reading this story."
          - "I wrote a breakdown of React performance. Link in bio."
          - "Here’s my latest newsletter issue. Paid subscribers get the full version."
          - "Read my write-up and share it if it helps you."
          - "I’m monetizing my blog with affiliate links, here’s my new post."
          - "Follow me on Medium for more posts like this."
          - "Buy me a coffee if you found my article useful."

        negatives:
          - "Can you recommend good Medium writers on distributed systems?"
          - "I read a Medium article about Kubernetes yesterday."
          - "Is Medium Partner Program worth it?"
          - "How do I start a blog and set up SEO?"
          - "Can you summarize this Medium post I’m reading?"
          - "I’m building a blogging platform (not promoting a blog)."
          - "What’s the best way to structure a technical article?"
          - "How do ads work on websites?"
          - "I need help editing my draft before I publish it."
          - "Where can I find credible sources on this topic?"
    - group: project_seeking_request
      description: >
        People searching for projects to join or contribute to (open-source, side projects,
        hackathon builds, community projects). Unlike collaboration_partnership_request,
        the speaker is *seeking an existing project/team* rather than recruiting others
        for their own project.
      cues:
        # Direct intent to find a project to join
        - "looking for a project"
        - "looking for projects"
        - "seeking a project"
        - "seeking projects"
        - "looking for a project to join"
        - "looking to join a project"
        - "want to join a project"
        - "any projects i can join"
        - "anyone have a project i can help with"
        - "anyone need help on a project"
        - "anyone need an extra hand"
        - "looking for something to work on"
        - "looking for a side project"
        - "looking for a weekend project"
        - "looking for a hobby project"
        - "looking for a fun project"
        - "looking for real-world projects"

        # Contribution language (especially OSS)
        - "looking to contribute"
        - "want to contribute"
        - "open source project to contribute to"
        - "any open source projects"
        - "any repos needing help"
        - "maintainers needed"
        - "maintainer looking for help"
        - "contributors wanted"
        - "i can contribute"
        - "i'm happy to contribute"
        - "good first issue"
        - "beginner friendly issues"
        - "help wanted"
        - "help-wanted"
        - "first-timers only"
        - "issues to pick up"
        - "tickets to pick up"

        # Team-joining (without “partner/cofounder” framing)
        - "join a team"
        - "join a dev team"
        - "join a hackathon team"
        - "looking for a hackathon project"
        - "any hackathon teams need"
        - "looking for a team to join"
        - "need a team to join"

      examples:
        positives:
          - "Looking for an open-source project to contribute to. Any maintainers need help?"
          - "I’ve got evenings free. Anyone have a side project I can join?"
          - "Any repos with beginner-friendly issues? I want something real to work on."
          - "Looking for a hackathon team/project to jump into this weekend."
          - "Seeking projects needing a frontend contributor (React)."
          - "Does anyone need an extra engineer on an existing project?"
          - "I want to contribute to a community project. Where can I help?"
          - "Any maintainers looking for contributors for bug fixes and docs?"
          - "Looking for something to build with a team, preferably OSS."
          - "Any projects with a backlog of issues I can pick up?"

        negatives:
          - "Looking for collaborators for my project (need a backend dev)."   # recruiting, not seeking
          - "We are hiring engineers for our team."                            # recruiting/hiring
          - "Freelance developer available for paid client projects."          # services-for-hire
          - "Can you help me with my school project?"                          # help request, not seeking a project to join
          - "Looking for project ideas for my portfolio."                      # ideas, not joining an existing project
          - "What project management tool should we use?"                      # PM tooling
          - "I’m looking for a contractor to deliver a project."               # hiring a contractor
          - "Partner wanted for my startup (cofounder)."                       # partnership/cofounder
          - "Join our Discord community for projects."                         # community invite
          - "Here’s my project, check it out."                                 # product/project promo
    - group: investor_fundraising_request
      description: >
        Seeking investors or funding for a startup/project (angel/VC), including pitch-deck outreach,
        “raising a round,” and DM-based investor solicitation. Typically framed as fundraising rather
        than offering guaranteed returns (which belongs in fraudulent investment promos).
      cues:
        # Direct investor seeking
        - "seeking investors"
        - "looking for investors"
        - "searching for investors"
