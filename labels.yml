        # Common context signals
        - "laid off"
        - "recently laid off"
        - "impacted by layoffs"
        - "seeking my next role"
        - "seeking my next opportunity"
        - "returning to work"
        - "re-entering the workforce"

        # Logistics (often present in job-seeker posts)
