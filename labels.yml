        - "part-time role"
        - "full-time position"
        - "permanent role"
        - "permanent position"
        - "employee position"
        - "FTE"
        - "W2"
        - "salaried"
        - "salary range"
        - "benefits"
        - "health benefits"
        - "401k"
        - "pension"
        - "internship"
        - "intern"
        - "new grad"
        - "graduate role"
        - "entry-level role"
        - "junior role"
        - "career switch"
        - "career transition"

        # Referral / recruiter outreach phrasing
        - "referral"
        - "referrals appreciated"
        - "any referrals"
        - "please refer"
        - "can anyone refer"
        - "recruiter"
        - "recruiters"
        - "recruiter reach out"
        - "connect me with a recruiter"
        - "hiring manager"
        - "if your team is hiring"
        - "if you know of openings"
