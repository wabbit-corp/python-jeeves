        - "raising capital"
        - "fundraising"
        - "fund raise"
        - "funding"
        - "seeking funding"
        - "looking for funding"
        - "capital raise"
        - "raise a round"
        - "closing a round"
        - "pre-seed"
        - "seed round"
        - "seed funding"
        - "series a"
        - "series b"
        - "bridge round"
        - "convertible note"
        - "safe note"
        - "term sheet"
        - "valuation"
        - "cap table"
        - "runway"

        # Pitch / outreach patterns
        - "pitch deck"
        - "deck"
        - "investor deck"
        - "pitch"
        - "pitching"
        - "demo"
        - "product demo"
        - "intro to investors"
        - "warm intro"
        - "happy to share more details"
        - "let's discuss opportunities"
        - "potential opportunity"
        - "dm me"
        - "message me"
        - "inbox me"
        - "reach out"
        - "connect with investors"

        # Startup-y context (weak signals, but useful)
        - "mvp"
        - "startup"
        - "founder"
        - "cofounder"     # can overlap with partnership requests
        - "go-to-market"
        - "traction"
        - "pre-revenue"
        - "revenue"
        - "users"
        - "growth"
        - "accelerator"
        - "incubator"

      examples:
        positives:
          - "I am actively seeking investors to support my ventures. DM me to discuss."
          - "Raising a pre-seed round for our MVP. Looking for angels."
          - "We’re fundraising for seed. Happy to share our pitch deck."
          - "Searching for a lead investor for our Series A."
          - "Seeking funding for a healthcare AI startup. Message me for the deck."
          - "Looking for strategic investors and introductions to VCs."
          - "Closing our seed round soon. Reach out if interested."
          - "Raising capital via SAFE note. DM for details."
          - "Seeking an investor partner to accelerate go-to-market."
          - "I’d love a warm intro to investors interested in AI/ML."

        negatives:
          - "How do I pitch VCs effectively? Any advice?"
          - "What’s the difference between seed and Series A?"
          - "I’m investing my savings, should I buy ETFs?"
          - "Guaranteed 10% daily returns, DM to join."   # fraudulent_investment_opportunities instead
          - "Looking for collaborators to help build my project."  # collaboration/partnership
          - "We are hiring engineers."                    # recruiting/hiring
          - "Check out my app, launching soon."           # promo_product_or_project
          - "Is this investor outreach message a scam?"
          - "I’m reading about venture capital trends."
          - "Can you review my pitch deck copy?"          # could be normal assistance, not solicitation
    - group: engagement_bait_or_karma_farming
      description: >
        Posts primarily asking for engagement (upvotes/likes/shares/stars/follows)
        to boost metrics, often paired with a linkdrop. No giveaway or substantive request.
      cues:
        - "upvote"
        - "a few upvotes"
        - "like and share"
        - "retweet"
        - "clap"
        - "star the repo"
        - "follow me"
        - "boost this"
        - "help me win"
        - "vote for my"
      examples:
        positives:
          - "A few upvotes please! Here’s my app: <link>"
          - "Star my repo if you like it: <repo link>"
          - "Boost this post so more people see it."
        negatives:
          - "How do upvotes work on this platform?"
          - "Can you review my repo? Here’s the link. (no engagement ask)"
          - "Contest giveaway: like/share to enter (belongs in contest_giveaway_prize)"
    - group: promo_personal_content
      description: >
        Promoting self-authored educational content to drive attention/traffic/brand:
        blog posts, newsletters, notebooks (Kaggle/Colab), tutorials, videos, etc.
        Often includes "check it out" + link + soft CTA (feedback welcome, subscribe, follow).
      cues:
        - "i'm happy to share"
        - "i wrote"
        - "i published"
        - "my latest"
        - "check it out"
        - "here's the link"
        - "feedback welcome"
        - "let me know your thoughts"
        # platform cues (expand as needed)
        - "kaggle.com/code/"
        - "colab.research.google.com"
        - "medium.com"
        - "substack.com"
        - "dev.to"
        - "hashnode"
        - "youtube.com"
      examples:
        positives:
          - "I’m happy to share my latest Kaggle notebook on BART fine-tuning. Here’s the link."
          - "I wrote a tutorial on attention mechanisms. Check it out and let me know your thoughts."
        negatives:
          - "Can someone recommend a Kaggle notebook on summarization?"  # resource request
          - "Here’s a paper summary + critique + question (no self-promo CTA)." # high_signal
    - group: application_or_lead_capture_form
      description: >
        Asking users to submit details via a form (Google Forms/Typeform/etc.) to apply, join,
        enroll, or be contacted. Not research questionnaires; it’s intake/funneling.
      cues:
        - "form link"
        - "fill out this form"
        - "apply here"
        - "registration form"
        - "forms.gle"
        - "typeform"
        - "google form"
        - "submit your details"
      examples:
        positives:
          - "FORM LINK: forms.gle/... Apply for our training/internship."
          - "Fill this registration form to join."
        negatives:
          - "Anonymous survey for research participants (research_recruitment/survey)."

- group: careers_and_employment
  description: "Careers & Employment"
  subgroups:
    - group: job_seeker_employee_position
      description: >
        Individuals seeking an employee role (full-time/part-time/internship/temp-to-perm),
        not marketing freelance/agency services. Often includes “open to work”, referrals,
        resume/CV sharing, and role-specific job seeking posts.
