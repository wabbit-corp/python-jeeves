          - "I read this ACL paper on compression-based classification. It works by ____. That makes me wonder how LLM context handling could incorporate compression. Thoughts?"
          - "OpenReview paper: they claim method X improves sample efficiency. I think the key assumption is ____. Does this break under __?"
          - "I reproduced the results on dataset D and got slightly different numbers. Here’s what changed. Any ideas why?"

        negatives:
          - "Interesting paper: <link>"                          # linkdrop_no_context (no summary)
          - "Anyone got the PDF for this paper?"                # resource request
          - "Check out my paper and follow me"                  # promo_product_or_project / blog promo
          - "Can someone explain attention?"                    # generic question (not high-effort)
          - "Here’s a random blog post, thoughts? <link>"       # may be blog promo or linkdrop unless summarized

- group: community_meta
  description: "Meta/community-structure content (introductions, housekeeping, onboarding)."
  subgroups:
    - group: self_introduction_new_member
      description: >
        Self-introduction posts where a user introduces themselves (name/background/skills/interests),
        often as a newcomer. May include secondary requests (study group, projects, jobs, roadmap),
        but the primary function is introduction / onboarding.
      cues:
        # Greeting + intro framing
        - "hello everyone"
        - "hi everyone"
        - "hey everyone"
        - "hello all"
        - "hi all"
        - "hey all"
        - "greetings"
        - "nice to meet you"
        - "pleased to meet you"
        - "new here"
        - "new to the group"
        - "new to this community"
        - "just joined"
        - "recently joined"
        - "first time here"
        - "introduction"
        - "intro"

        # Identity statements
        - "my name is"
        - "i'm"
        - "i am"
        - "call me"
        - "i recently graduated"
        - "i work as"
        - "i'm a"
        - "i am a"
        - "background in"
        - "currently studying"
        - "i'm learning"
        - "i am learning"
        - "i have experience in"
        - "my interests are"
        - "i'm interested in"

        # Common structure markers
        - "a little about me"
        - "about me"
        - "here's a bit about"
        - "brief introduction"
        - "let me introduce myself"
        - "thanks for having me"
        - "glad to be here"
        - "happy to join"

      examples:
        positives:
          - "Hello everyone, my name is Abdul and I recently graduated in IT. I’m interested in data science..."
          - "Hi all, I’m new here. I’m learning Python and excited to connect."
          - "Hey everyone! Quick intro: I’m a frontend dev transitioning to ML."
          - "Nice to meet you all. I’m just joining this community and wanted to introduce myself."
          - "Hello! A little about me: I work in QA and I’m learning automation."

        negatives:
          - "Looking for a study group for ML, anyone interested?"          # study_group_request
          - "What’s the roadmap to learn data science?"                     # roadmap_request
          - "Freelancer available for work, DM me."                         # promo_services_for_hire
          - "Where can I post hackathon announcements?"                     # channel_routing_request
          - "We are hiring data analysts."                                  # recruiting_hiring_request

- group: user_safety_and_crisis
  description: "User safety & crisis content (risk of harm, urgent intervention, or destabilized mental state)."
  subgroups:
    - group: psychosis_delusional_paranoia
      description: >
        Reality-detached personal belief reports consistent with paranoia/psychosis:
        being targeted, monitored, mind-controlled, implanted, hearing voices, telepathy,
        hidden agents, etc. Typically framed as literal and immediate, with special knowledge,
        and may include calls to action or fear-based warnings.
      cues:
        # Persecutory / surveillance delusions
        - "they are watching me"
        - "they're following me"
        - "gangstalking"
        - "implanted"
        - "chip in my"
        - "bugs in my body"
        - "nanobots"
        - "they read my thoughts"
        - "mind control"
        - "telepathy"
        - "voices in my head"
        - "they can make me feel emotions"
        - "they have my DNA"
        - "everyone who reads this will be harmed"
        # Grandiose / bizarre tech claims framed as immediate reality
        - "secret base"
        - "they control the internet"
        - "they can edit maps"
        - "quantum weapon"
        - "invisible to satellites"
      examples:
        positives:
          - "There are people monitoring me through devices and they can hear my thoughts."
          - "A group is controlling my body with signals and I can feel it happening."
          - "They put something inside me and now I hear voices telling me what to do."
          - "A secret organization is tracking everyone who reads my messages."
        negatives:
          - "I was diagnosed with schizophrenia and I’m trying to manage symptoms."
          - "What are common symptoms of psychosis and how do people get help?"
          - "This novel I'm writing has mind control and telepathy (fiction)."
          - "I’m discussing conspiracy theories as a social phenomenon (not endorsing)."
    - group: self_harm_or_suicidality
      description: >
        Content expressing self-harm or suicidal ideation/intent, past attempts, imminent risk,
        or explicit desire to die. Includes vague ideation ("wish I were dead") through explicit intent.
      cues:
        - "suicide"
        - "kill myself"
        - "end my life"
        - "end it all"
        - "i want to die"
        - "i wish i was dead"
        - "can't go on"
        - "no reason to live"
        - "self harm"
        - "self-harm"
        - "hurt myself"
        - "i harmed myself"
        - "i cut myself"
        - "overdose"
        - "attempted"
        - "i'm going to do it"
        - "goodbye everyone"
      examples:
        positives:
          - "I want to kill myself."
          - "I self-harmed again last night."
          - "I don’t want to be alive anymore."
          - "I tried to end my life before and I’m scared I’ll do it again."
        negatives:
          - "I’m being too hard on myself and stuck in negative self-talk."
          - "Life feels difficult lately but I’m not thinking about self-harm."
          - "Discussion of suicide rates/statistics in a news context."
          - "Fictional writing involving suicide (clearly framed as fiction)."
    - group: self_harm_encouragement_or_glorification
      description: >
        Encouraging, mocking, or celebrating self-harm/suicide (directed at self or others),
        including coercive "kys" style messages.
      cues:
        - "kill yourself"
        - "kys"
        - "you should die"
        - "do it"
        - "end it"
        - "world would be better without you"
        - "finally did it"
        - "glad they died"
      examples:
        positives:
          - "Kill yourself."
          - "Do it already, nobody cares."
          - "Good, they should have ended it."
        negatives:
          - "I’m worried about my friend who sounds suicidal. What should I do?"
          - "This book portrays suicide, and I’m analyzing the theme."
    - group: emotional_distress_negative_self_talk
      description: >
        Low-to-moderate acuity mental health distress: self-criticism, rumination, shame,
        anxiety spirals, depression talk without explicit self-harm/suicide intent.
        Often phrased as "I hurt myself with thoughts" or "I punish myself mentally."
      cues:
        - "negative thoughts"
        - "i hate myself"
        - "i'm worthless"
        - "i'm a failure"
        - "i'm so stupid"
        - "self-sabotage"
        - "ruminating"
        - "can't stop overthinking"
        - "self-inflicted"
        - "i punish myself"
        - "i judge myself"
      examples:
        positives:
          - "I keep having negative thoughts about myself and it’s exhausting."
          - "I’m constantly judging myself and it feels like self-inflicted pain."
          - "I can’t stop spiraling and telling myself I’m worthless."
        negatives:
          - "I want to hurt myself physically."   # self_harm_or_suicidality
          - "Kill yourself."                       # self_harm_encouragement_or_glorification

- group: violence_and_targeting
  description: "Violence, harm advocacy, and targeting (including doxxing)."
  subgroups:
    - group: violence_or_harm_advocacy
      description: >
        Encouraging, endorsing, organizing, or threatening physical harm to people or property.
        Includes calls to attack/siege/assassinate, violent threats, and celebration of violence
        in a way that promotes more harm. (Not: news discussion, prevention, or de-escalation.)
      cues:
        # Direct advocacy / incitement
        - "someone should kill"
        - "they deserve to die"
        - "go attack"
        - "go hurt"
        - "beat them up"
        - "shoot"
        - "stab"
        - "burn it down"
        - "bomb"
        - "lynch"
        - "execute"
        - "assassinate"
        - "wipe them out"
        - "exterminate"
        - "siege"
        - "hunt them"
        - "take them out"
        - "teach them a lesson"

        # Threats (often overlap with advocacy in moderation flows)
        - "i will kill you"
        - "i'm going to hurt you"
        - "you're dead"
        - "watch your back"
        - "i know where you live"

        # Violence-adjacent mobilization
        - "bring weapons"
        - "armed"
        - "attack plan"
        - "target"
        - "hit list"
      examples:
        positives:
          - "Someone needs to go hurt them for what they did."
          - "We should siege their building until they surrender."
          - "They deserve to die. Make it happen."
          - "I’m going to kill you when I see you."
          - "Burn their office down."
        negatives:
          - "This news article describes an attack that happened yesterday."
          - "How do I de-escalate a fight safely?"
          - "I’m writing a novel and this character threatens someone (fiction context)."
          - "What are warning signs someone might become violent?"
          - "Self-defense laws vary by location, what’s the general idea? (non-actionable discussion)"
    - group: doxxing_or_targeting
      description: >
        Sharing or requesting personal identifying information (PII) or actionable location info
        about a person, or directing harassment toward a person (e.g., “go to their house,” “call
        their employer”). Includes “soft doxxing” (workplace, neighborhood, school) and “targeting”
        even without full PII when the intent is harassment or harm.
      cues:
        # Explicit doxxing language
        - "dox"
        - "doxx"
        - "doxxing"
        - "expose"
        - "real name"
        - "legal name"
        - "home address"
        - "address is"
        - "phone number"
        - "email address"
        - "ip address"
        - "social security"
        - "passport"
        - "driver's license"
        - "license plate"
        - "work address"
        - "where they work"
        - "where they live"
        - "their family"

        # Coordinates / maps / actionable location
        - "coordinates"
        - "latitude"
        - "longitude"
        - "gps"
        - "google maps"
        - "pin drop"
        - "drop a pin"
        - "map link"

        # Targeting / harassment funnels
        - "go to their house"
        - "pay them a visit"
        - "swat"
        - "call their boss"
        - "report them to"
        - "spam them"
        - "brigade"
        - "mass report"
      examples:
        positives:
          - "Here’s their home address and phone number. Do what you want with it."
          - "Anyone know where this person lives? I want to confront them."
          - "Their workplace is [company/location], go show up and film them."
          - "I found their license plate number, spread it."
          - "Here’s a map pin to their house. Pay them a visit."
        negatives:
          - "How do I protect myself from being doxxed online?"
          - "This company’s customer support phone number is on their website."
          - "Public figure’s official office address (already widely published and not used to harass)."
          - "Can you help me report harassment to moderators/platform support?"
          - "Here’s a general city-level location for an event (not about a person)."
    - group: violent_threat_or_death_wish
      description: >
        Threats, intimidation, or wishes of death/physical harm directed at a person
        (or their family/associates). Includes explicit threats ("I'll kill you") and
        cruel death wishes ("I hope you die", "I hope your mom dies").
        Excludes self-harm directives aimed at the target ("kys"), which belong under
        self_harm_encouragement_or_glorification.
      cues:
        # Explicit threats
        - "i will kill you"
        - "i'm going to kill you"
        - "i'll hurt you"
        - "i'll beat you"
        - "you're dead"
        - "watch your back"
        - "i'm coming for you"
        # Death wishes / violent malice
        - "i hope you die"
        - "i hope you suffer"
        - "die in a fire"
        - "i hope your mom dies"
        - "i hope your family dies"
        - "i hope you get murdered"
        # Implied harm (often paired with intimidation)
        - "you'll regret this"
        - "you'll pay for this"
      examples:
        positives:
          - "I hope your mom dies in your arms."
          - "You're dead. Watch your back."
          - "I hope you die slowly."
          - "I'm going to hurt you when I see you."
        negatives:
          - "This character says 'you're dead' in a fictional quote (clearly framed)."
          - "News reporting about threats (non-endorsement)."
          - "Kill yourself / kys"  # self_harm_encouragement_or_glorification

- group: harassment_and_abuse
  description: "Interpersonal abuse: insults, bullying, degrading remarks, and targeted harassment."
  subgroups:
    - group: harassment_personal_attack
      description: >
        Direct insults or derogatory statements aimed at a person (or a clear target), including
        name-calling and demeaning character attacks. Not identity-based hate; just being nasty.
      cues:
        - "you're narcissistic"
        - "you're pathetic"
        - "you're disgusting"
        - "idiot"
        - "moron"
        - "loser"
        - "shut up"
        - "nobody asked"
        - "go away"
        - "i hate you"
      examples:
        positives:
          - "Because you're narcissistic."
          - "You're a pathetic loser."
          - "Shut up, nobody cares what you think."
        negatives:
          - "I disagree with your argument because..."
          - "That idea doesn't make sense to me (no personal attack)."
          - "Narcissism is discussed as a clinical topic, not aimed at a person."
    - group: identity_or_health_based_derogation
      description: >
        Using identity, disability, neurotype, or mental health labels as insults or as a means
        to demean a target (ableism/pathologizing). Includes “armchair diagnosis” when used to
        insult or discredit someone ("you’re autistic", "you’re bipolar", "you’re a narcissist")
        rather than a genuine clinical discussion.
      cues:
        # Disability / neurotype as insult
        - "are you autistic"
        - "you're autistic"
        - "autist"
        - "sperg"
        - "retard"
        - "brain damaged"
        # Pathologizing / diagnosis-as-insult
        - "narcissist"
        - "narcissistic"
        - "psychopath"
        - "sociopath"
        - "schizo"
        - "bipolar"
        - "borderline"
        - "crazy"
        - "insane"
      examples:
        positives:
          - "So you're an autistic woman?"
          - "You’re a narcissist, that’s why you act like this."
          - "Stop being bipolar."
        negatives:
          - "I’m autistic and looking for coping strategies."
          - "Narcissistic Personality Disorder is defined as..."
          - "We’re discussing neurodiversity respectfully."

- group: sexual_content_and_exploitation
  description: "Sexual content, pornography promotion, and sexual exploitation risk (including CSAM-suspected)."
  subgroups:
    - group: adult_pornography_promotion
      description: >
