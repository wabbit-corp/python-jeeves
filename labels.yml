- group: conversational_hygiene
  description: "Short interaction-management messages (courtesies, acknowledgements, coordination)."
  subgroups:
    - group: gratitude_or_acknowledgement
      description: >
        Expressing thanks, appreciation, or acknowledgement for help/information.
        Includes short gratitude replies ("thanks", "ty") and "karma/upvote" given as appreciation.
        Excludes engagement solicitation ("please upvote") and sarcastic/hostile "thanks".
      cues:
        # Plain thanks
        - "thanks"
        - "thank you"
        - "thanks man"
        - "thanks mate"
        - "ty"
        - "thx"
        - "tysm"
        - "thanks for the help"
        - "thanks for your help"
        - "thanks for explaining"
        - "appreciate it"
        - "much appreciated"
        - "appreciate your help"
        - "cheers"
        - "grateful"
        - "🙏"
        # “Giving karma” / positive feedback
        - "upvoted"
        - "take my upvote"
        - "have an upvote"
        - "gave you an upvote"
        - "gave you karma"
        - "here's some karma"
        - "award"
        - "gave you gold"
        - "gave you silver"
      examples:
        positives:
          - "Thanks man."
