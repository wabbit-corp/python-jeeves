- group: promo_and_solicitation
  description: "Promotion & Solicitation"
  subgroups:
    - group: promo_services_for_hire
      description: Someone marketing themselves as available for work (portfolio pitch, skills list, “DM me”).
      cues:
        - "available for work"
        - "open to work"
        - "open for work"
        - "currently available"
        - "taking new clients"
        - "accepting clients"
        - "accepting projects"
        - "freelance"
        - "freelancer"
        - "contractor"
        - "for hire"
        - "hire me"
        - "hire us"
        - "looking for gigs"
        - "looking for work"
        - "seeking opportunities"
        - "DM me"
        - "message me"
        - "inbox me"
        - "reach out"
        - "contact me"
        - "let's work together"
        - "work with me"
        - "commission"
        - "my rates"
        - "rate card"
        - "portfolio"
        - "bookings open"
        - "slots available"
      examples:
        positives:
          - "Freelance developer available for work. DM me for details."
          - "Open to work: backend + infra. Portfolio in bio."
          - "Taking new clients this month. Message me if you need help."
          - "For hire: I build Shopify stores. Rates available on request."
        negatives:
          - "How do I hire a freelancer without getting scammed?"
          - "I’m updating my portfolio site and need feedback."
          - "My company is hiring a contractor, but I’m not the recruiter."
          - "What does “open to work” mean on LinkedIn?"
