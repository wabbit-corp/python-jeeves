[project]
name = "jeeves"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "aiohttp",
    "discord.py",
    "emoji",
    "hypothesis",
    "Levenshtein",
    "numpy",
    "openai",
    "PyGithub",
    "PyYAML",
    "python-dateutil",
    "python-dotenv",
    "pytz",
    "requests",
    "sentence-transformers",
    "timezonefinder",
    "tqdm",
    "youtube-transcript-api",
]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B"]

[tool.pytest.ini_options]
testpaths = ["tests", "codi/api/tests"]

[tool.deptry.package_module_name_map]
"discord.py" = "discord"
"PyGithub" = "github"
"PyYAML" = "yaml"
"python-dateutil" = "dateutil"
"python-dotenv" = "dotenv"
"sentence-transformers" = "sentence_transformers"
"youtube-transcript-api" = "youtube_transcript_api"

[tool.deptry]
per_rule_ignores = { "DEP002" = ["hypothesis"] }

[tool.importlinter]
root_packages = ["servant", "typed_json"]

# Enforce that siblings under these ancestors don't form cycles
[[tool.importlinter.contracts]]
id = "no-sibling-cycles"
name = "No dependency cycles between sibling packages"
type = "acyclic_siblings"
ancestors = ["servant"]
depth = 10

# Optional: enforce a strict layering (example)
[[tool.importlinter.contracts]]
id = "layering"
name = "Layered architecture"
type = "layers"
layers = [
  "servant",
  "codi",
  "typed_json",
]

[tool.coverage.run]
branch = true
source = ["servant", "typed_json"]
omit = [
  "tests/*",
  "codi/api/tests/*",
  ".venv/*",
  "**/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 15
precision = 0

[tool.coverage.xml]
output = "coverage.xml"
