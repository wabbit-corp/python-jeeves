[tool.black]
line-length = 120
target-version = ["py310"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
pretty = true

[tool.ruff.lint.per-file-ignores]
"codi/api/tests/**/*.py" = ["B"]
"tests/**/*.py" = ["B"]

[tool.pytest.ini_options]
testpaths = ["codi/api/tests", "tests"]

[tool.deptry.package_module_name_map]
"discord-ext-voice-recv" = "discord.ext.voice_recv"
"discord.py" = "discord"
"djangorestframework" = "rest_framework"
"imbalanced-learn" = "imblearn"
"levenshtein" = "Levenshtein"
"pygithub" = "github"
"pynacl" = "nacl"
"python-dateutil" = "dateutil"
"python-dotenv" = "dotenv"
"pyyaml" = "yaml"
"scikit-learn" = "sklearn"
"sentence-transformers" = "sentence_transformers"
"youtube-transcript-api" = "youtube_transcript_api"

[tool.deptry]
per_rule_ignores = { "DEP004" = ["pytest", "mypy", "ruff", "black", "coverage", "build", "twine", "codespell", "mkdocs", "mkdocs-material"] }

[tool.coverage.run]
branch = true
source = ["codi", "servant", "typed_json"]
omit = ["**/__pycache__/*", ".venv/*", "codi/api/tests/*", "tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80
precision = 0

[tool.coverage.xml]
output = "coverage.xml"

